name: Daily Orion Scrape

on:
  schedule:
    - cron: '0 3 * * *' # Pokreće se svako veče u 3 ujutru
  workflow_dispatch: # Omogućava ti da pokreneš ručno iz GitHub-a za test

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kod
      uses: actions/checkout@v3

    - name: Podešavanje Pythona
      uses: actions/setup-python@v4
      with:
        python-node: '3.10'

    - name: Instalacija biblioteka
      run: |
        pip install requests beautifulsoup4

    - name: Pokretanje skrepovanja
      run: |
        python scraper_cene.py

    # KLJUČNI KORAK KOJI TI NEDOSTAJE:
    - name: Guranje fajla na Hugging Face Space
      uses: huggingface/hf-action@v1
      with:
        git-remote-url: https://huggingface.co/spaces/dexilio/orion-chatbot
        token: ${{ secrets.HF_TOKEN }}
        title: "Automatsko osvežavanje cena komponente.json"