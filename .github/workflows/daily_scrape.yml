name: Daily Orion Scrape

on:
  schedule:
    - cron: '0 0 * * *' # Pokreće se svake noći u ponoć
  workflow_dispatch: # Omogućava ti da pokreneš ručno kad god želiš

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper_cene.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add komponente.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatsko osvežavanje cena" && git push)