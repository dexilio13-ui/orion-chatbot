name: Daily Orion Scrape

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kod
      uses: actions/checkout@v3

    - name: Podešavanje Pythona
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'   # ✅ FIX #1

    - name: Instalacija biblioteka
      run: |
        pip install requests beautifulsoup4

    - name: Pokretanje skrepovanja
      run: |
        python scraper_cene.py

    - name: Podešavanje Git LFS   # ✅ FIX #3
      run: git lfs install

    - name: Guranje fajla na Hugging Face Space   # ✅ FIX #2
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git clone https://user:$HF_TOKEN@huggingface.co/spaces/dexilio/orion-chatbot hf_space
        cp komponente.json hf_space/komponente.json
        cd hf_space
        git add komponente.json
        git commit -m "Auto update cena $(date '+%Y-%m-%d')" || echo "Nema promena"
        git push
